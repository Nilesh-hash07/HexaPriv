[package]
name = "privacy-common"
version = "0.1.0"
edition = "2021"
description = "Common cryptographic primitives and zero-knowledge protocol types"

[dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
zeroize = { version = "1.7", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
hkdf = "0.12"

